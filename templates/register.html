<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — DiabetesAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Inter',sans-serif; min-height:100vh;
            background:linear-gradient(135deg,#f8faff 0%,#eef2ff 100%);
            display:flex; align-items:center; justify-content:center; padding:1.5rem;
        }
        .card {
            background:#fff; border-radius:28px; padding:2.5rem 2rem;
            width:100%; max-width:440px;
            box-shadow:0 20px 60px rgba(37,99,235,0.12); border:1px solid #e0e7ff;
        }
        .logo { text-align:center; margin-bottom:2rem; }
        .logo-icon {
            width:64px; height:64px;
            background:linear-gradient(135deg,#059669,#047857);
            border-radius:20px; display:flex; align-items:center; justify-content:center;
            margin:0 auto 0.8rem; box-shadow:0 8px 25px rgba(5,150,105,0.3);
        }
        .logo h1 { font-size:1.5rem; font-weight:800; color:#0a1c3a; }
        .logo p  { font-size:0.82rem; color:#5a6e8a; margin-top:0.2rem; }
        .form-group { margin-bottom:1.1rem; }
        label { font-size:0.8rem; font-weight:600; color:#0a1c3a; display:block; margin-bottom:0.4rem; }
        input {
            width:100%; padding:0.85rem 1rem;
            border:1.5px solid #e0e7ff; border-radius:14px;
            font-family:'Inter',sans-serif; font-size:0.92rem;
            transition:all 0.3s; background:#fafbff; color:#0a1c3a;
        }
        input:focus { outline:none; border-color:#059669; box-shadow:0 0 0 3px rgba(5,150,105,0.1); }
        .input-hint { font-size:0.73rem; color:#94a3b8; margin-top:0.25rem; }
        .btn {
            width:100%; padding:0.95rem;
            background:linear-gradient(135deg,#059669,#047857);
            color:#fff; border:none; border-radius:14px;
            font-family:'Inter',sans-serif; font-size:0.95rem; font-weight:600;
            cursor:pointer; transition:all 0.3s;
            display:flex; align-items:center; justify-content:center; gap:0.5rem;
            margin-top:0.5rem;
        }
        .btn:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(5,150,105,0.35); }
        .btn:disabled { opacity:0.7; cursor:not-allowed; transform:none; }
        .divider { text-align:center; margin:1.2rem 0; color:#94a3b8; font-size:0.8rem; }
        .link-text { text-align:center; font-size:0.83rem; color:#5a6e8a; }
        .link-text a { color:#2563eb; font-weight:600; text-decoration:none; }
        .link-text a:hover { text-decoration:underline; }
        .error-box {
            background:#fef2f2; border:1px solid #fecaca; border-radius:12px;
            padding:0.7rem 1rem; font-size:0.82rem; color:#dc2626;
            margin-bottom:1rem; display:none; align-items:center; gap:0.5rem;
        }
        .success-box {
            background:#ecfdf5; border:1px solid #bbf7d0; border-radius:12px;
            padding:0.7rem 1rem; font-size:0.82rem; color:#059669;
            margin-bottom:1rem; display:none; align-items:center; gap:0.5rem;
        }
        .strength-bar { height:4px; border-radius:4px; background:#e2e8f0; margin-top:0.4rem; overflow:hidden; }
        .strength-fill { height:100%; border-radius:4px; transition:all 0.3s; width:0; }
        .back-home { text-align:center; margin-top:1.5rem; }
        .back-home a { color:#94a3b8; font-size:0.8rem; text-decoration:none; display:inline-flex; align-items:center; gap:0.4rem; }
        .back-home a:hover { color:#2563eb; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-user-plus" style="color:#fff;font-size:1.4rem;"></i>
            </div>
            <h1>Create Account</h1>
            <p>Join DiabetesAI — it's free</p>
        </div>

        <div class="error-box" id="errorBox">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorMsg"></span>
        </div>
        <div class="success-box" id="successBox">
            <i class="fas fa-check-circle"></i>
            <span id="successMsg"></span>
        </div>

        <div class="form-group">
            <label><i class="fas fa-user" style="color:#059669;margin-right:0.3rem;"></i> Username</label>
            <input type="text" id="username" placeholder="Choose a username" autocomplete="username">
        </div>

        <div class="form-group">
            <label><i class="fas fa-envelope" style="color:#059669;margin-right:0.3rem;"></i> Email Address</label>
            <input type="email" id="email" placeholder="your@email.com" autocomplete="email">
        </div>

        <div class="form-group">
            <label><i class="fas fa-lock" style="color:#059669;margin-right:0.3rem;"></i> Password</label>
            <input type="password" id="password" placeholder="At least 6 characters"
                   autocomplete="new-password" oninput="checkStrength(this.value)">
            <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
            <div class="input-hint" id="strengthText">Enter a password</div>
        </div>

        <div class="form-group">
            <label><i class="fas fa-lock" style="color:#059669;margin-right:0.3rem;"></i> Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Repeat password"
                   autocomplete="new-password" onkeypress="if(event.key==='Enter') doRegister()">
        </div>

        <button class="btn" id="registerBtn" onclick="doRegister()">
            <i class="fas fa-user-plus"></i> Create Account
        </button>

        <div class="divider">— already have an account? —</div>
        <div class="link-text"><a href="/login">Sign in here</a></div>

        <div class="back-home">
            <a href="/"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>

    <script>
        function checkStrength(pw) {
            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');
            if (!pw) { fill.style.width='0'; text.textContent='Enter a password'; return; }
            let score = 0;
            if (pw.length >= 6)  score++;
            if (pw.length >= 10) score++;
            if (/[A-Z]/.test(pw)) score++;
            if (/[0-9]/.test(pw)) score++;
            if (/[^A-Za-z0-9]/.test(pw)) score++;
            const levels = [
                {w:'20%',  color:'#dc2626', label:'Very Weak'},
                {w:'40%',  color:'#ea580c', label:'Weak'},
                {w:'60%',  color:'#d97706', label:'Fair'},
                {w:'80%',  color:'#059669', label:'Strong'},
                {w:'100%', color:'#047857', label:'Very Strong'},
            ];
            const l = levels[Math.min(score-1, 4)];
            fill.style.width  = l.w;
            fill.style.background = l.color;
            text.textContent  = l.label;
            text.style.color  = l.color;
        }

        async function doRegister() {
            const btn      = document.getElementById('registerBtn');
            const username = document.getElementById('username').value.trim();
            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm  = document.getElementById('confirmPassword').value;
            hideMessages();

            if (!username || !email || !password || !confirm) { showError('All fields are required'); return; }
            if (password.length < 6) { showError('Password must be at least 6 characters'); return; }
            if (password !== confirm) { showError('Passwords do not match'); return; }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

            try {
                const res = await fetch('/register', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ username, email, password })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    showSuccess('Account created! Redirecting...');
                    setTimeout(() => window.location.href = data.redirect, 800);
                } else {
                    showError(data.message || 'Registration failed');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
                }
            } catch(e) {
                showError('Cannot connect to server.');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
            }
        }

        function showError(msg)   { document.getElementById('errorMsg').textContent=msg;   document.getElementById('errorBox').style.display='flex'; }
        function showSuccess(msg) { document.getElementById('successMsg').textContent=msg; document.getElementById('successBox').style.display='flex'; }
        function hideMessages()   { document.getElementById('errorBox').style.display='none'; document.getElementById('successBox').style.display='none'; }
    </script>
</body>
</html>
