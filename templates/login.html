<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — DiabetesAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Inter',sans-serif;
            min-height:100vh;
            background:linear-gradient(135deg,#f8faff 0%,#eef2ff 100%);
            display:flex; align-items:center; justify-content:center;
            padding:1.5rem;
        }
        .card {
            background:#fff;
            border-radius:28px;
            padding:2.5rem 2rem;
            width:100%; max-width:420px;
            box-shadow:0 20px 60px rgba(37,99,235,0.12);
            border:1px solid #e0e7ff;
        }
        .logo {
            text-align:center; margin-bottom:2rem;
        }
        .logo-icon {
            width:64px; height:64px;
            background:linear-gradient(135deg,#2563eb,#1e40af);
            border-radius:20px;
            display:flex; align-items:center; justify-content:center;
            margin:0 auto 0.8rem;
            box-shadow:0 8px 25px rgba(37,99,235,0.3);
        }
        .logo h1 { font-size:1.5rem; font-weight:800; color:#0a1c3a; }
        .logo p  { font-size:0.82rem; color:#5a6e8a; margin-top:0.2rem; }
        .form-group { margin-bottom:1.2rem; }
        label { font-size:0.8rem; font-weight:600; color:#0a1c3a; display:block; margin-bottom:0.4rem; }
        input {
            width:100%; padding:0.85rem 1rem;
            border:1.5px solid #e0e7ff; border-radius:14px;
            font-family:'Inter',sans-serif; font-size:0.92rem;
            transition:all 0.3s; background:#fafbff; color:#0a1c3a;
        }
        input:focus { outline:none; border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,0.1); }
        .btn {
            width:100%; padding:0.95rem;
            background:linear-gradient(135deg,#2563eb,#1e40af);
            color:#fff; border:none; border-radius:14px;
            font-family:'Inter',sans-serif; font-size:0.95rem; font-weight:600;
            cursor:pointer; transition:all 0.3s;
            display:flex; align-items:center; justify-content:center; gap:0.5rem;
        }
        .btn:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(37,99,235,0.35); }
        .btn:disabled { opacity:0.7; cursor:not-allowed; transform:none; }
        .divider { text-align:center; margin:1.2rem 0; color:#94a3b8; font-size:0.8rem; }
        .link-text { text-align:center; font-size:0.83rem; color:#5a6e8a; margin-top:1rem; }
        .link-text a { color:#2563eb; font-weight:600; text-decoration:none; }
        .link-text a:hover { text-decoration:underline; }
        .error-box {
            background:#fef2f2; border:1px solid #fecaca;
            border-radius:12px; padding:0.7rem 1rem;
            font-size:0.82rem; color:#dc2626;
            margin-bottom:1rem; display:none;
            align-items:center; gap:0.5rem;
        }
        .success-box {
            background:#ecfdf5; border:1px solid #bbf7d0;
            border-radius:12px; padding:0.7rem 1rem;
            font-size:0.82rem; color:#059669;
            margin-bottom:1rem; display:none;
            align-items:center; gap:0.5rem;
        }
        .back-home {
            text-align:center; margin-top:1.5rem;
        }
        .back-home a {
            color:#94a3b8; font-size:0.8rem; text-decoration:none;
            display:inline-flex; align-items:center; gap:0.4rem;
        }
        .back-home a:hover { color:#2563eb; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-heartbeat" style="color:#fff;font-size:1.5rem;"></i>
            </div>
            <h1>DiabetesAI</h1>
            <p>Sign in to your account</p>
        </div>

        <div class="error-box" id="errorBox">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorMsg"></span>
        </div>
        <div class="success-box" id="successBox">
            <i class="fas fa-check-circle"></i>
            <span id="successMsg"></span>
        </div>

        <div class="form-group">
            <label><i class="fas fa-envelope" style="color:#2563eb;margin-right:0.3rem;"></i> Email Address</label>
            <input type="email" id="email" placeholder="your@email.com" autocomplete="email">
        </div>

        <div class="form-group">
            <label><i class="fas fa-lock" style="color:#2563eb;margin-right:0.3rem;"></i> Password</label>
            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password"
                   onkeypress="if(event.key==='Enter') doLogin()">
        </div>

        <button class="btn" id="loginBtn" onclick="doLogin()">
            <i class="fas fa-sign-in-alt"></i> Sign In
        </button>

        <div class="divider">— or —</div>

        <div class="link-text">
            Don't have an account?
            <a href="/register">Create one free</a>
        </div>

        <div class="back-home">
            <a href="/"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>

    <script>
        async function doLogin() {
            const btn = document.getElementById('loginBtn');
            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            hideMessages();

            if (!email || !password) {
                showError('Please fill in all fields');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

            try {
                const res = await fetch('/login', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.status === 'success') {
                    showSuccess(data.message);
                    setTimeout(() => window.location.href = data.redirect, 800);
                } else {
                    showError(data.message || 'Login failed');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                }
            } catch(e) {
                showError('Cannot connect to server. Make sure Flask is running.');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            }
        }

        function showError(msg) {
            document.getElementById('errorMsg').textContent = msg;
            document.getElementById('errorBox').style.display = 'flex';
        }
        function showSuccess(msg) {
            document.getElementById('successMsg').textContent = msg;
            document.getElementById('successBox').style.display = 'flex';
        }
        function hideMessages() {
            document.getElementById('errorBox').style.display = 'none';
            document.getElementById('successBox').style.display = 'none';
        }
    </script>
</body>
</html>
